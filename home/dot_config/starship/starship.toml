# Starship prompt configuration
# https://starship.rs/config/

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$dotnet\
$kubernetes\
$nodejs\
$python\
$rust\
$golang\
$terraform\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[username]
show_always = false
style_user  = "bold yellow"
style_root  = "bold red"

[hostname]
ssh_only = true
style    = "bold green"

[directory]
style            = "bold cyan"
truncation_length = 3
truncate_to_repo  = true
read_only        = " 󰌾"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
format     = '($ahead_behind$untracked$staged$modified$renamed$deleted$conflicted )'
style      = "bold yellow"
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked  = "?${count} "
modified   = "!${count} "
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "
conflicted = "= "

[fill]
symbol = " "

[dotnet]
symbol = "\ue70c "
style  = "white"
format = "[$symbol$version]($style) "

[kubernetes]
symbol   = "\ufd31 "
style    = "bold #326CE5"
format   = "[$symbol$context( \\($namespace\\))]($style) "
disabled = false

[nodejs]
symbol = " "
style  = "bold green"

[python]
symbol = " "
style  = "bold yellow"

[rust]
symbol = " "
style  = "bold red"

[golang]
symbol = " "
style  = "bold cyan"

[terraform]
symbol = "󱁢 "
style  = "bold purple"

[cmd_duration]
min_time = 500
format   = "[$duration](bold yellow)"