# Starship prompt — al theme
# Replicates al-05-2022.omp.json (Oh My Posh → Starship)
# Switch to this theme: prompt-al
# Switch back:          prompt-minimal

format = """
$env_var\
$username\
$directory\
$git_branch\
$git_status\
$fill\
$dotnet\
$kubernetes\
$line_break\
$character"""

right_format = """$cmd_duration"""

[character]
success_symbol = "[❯](bold #00BBFF)"
error_symbol   = "[❯](bold red)"

[username]
show_always   = false
style_user    = "bold #E5C07B"
style_root    = "bold #E5C07B"
format        = "[$user]($style) [in](white) "

[directory]
style             = "bold #56B6C2"
format            = "[$path]($style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo  = false

[git_branch]
symbol = "\ue0a0"
style  = "bold #FF94DF"
format = "[on](white) [$symbol$branch]($style) "

[git_status]
style      = "white"
format     = '($ahead_behind$conflicted$staged$modified$renamed$deleted$untracked )'
ahead      = "[⇡${count}]($style) "
behind     = "[⇣${count}]($style) "
diverged   = "[⇕⇡${ahead_count}⇣${behind_count}]($style) "
up_to_date = ""
untracked  = "[?${count}]($style) "
modified   = "[!${count}](red) "
staged     = "[+${count}](#A7FFE2) "
renamed    = "[»${count}]($style) "
deleted    = "[✘${count}]($style) "
conflicted = "[=]($style) "

[fill]
symbol = " "

[dotnet]
symbol = "\ue70c "
style  = "white"
format = "[$symbol$version]($style) "

[kubernetes]
symbol   = "\ufd31 "
style    = "bold #326CE5"
format   = "[$symbol$context( \\($namespace\\))]($style) "
disabled = false

[status]
symbol     = "\uf00d"
success_symbol = "\uf42e"
style      = "white"
format     = "[$symbol]($style) "
disabled   = false

[sudo]
disabled = true

[env_var.IS_ADMIN]
symbol   = "\uf0e7 "
style    = "bold #E5C07B"
format   = "[$symbol]($style)"

[cmd_duration]
min_time = 3000
style    = "white"
format   = "[$duration]($style)"

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[terraform]
disabled = true

[hostname]
ssh_only = true
style    = "bold green"
