name: Prompt benchmark

on:
  workflow_dispatch:

jobs:
  bench-linux:
    name: Benchmark (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          # hyperfine
          wget -qO /tmp/hyperfine.deb \
            "https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb"
          sudo dpkg -i /tmp/hyperfine.deb
          # starship
          curl -fsSL https://starship.rs/install.sh | sh -s -- -y
          # zsh
          sudo apt-get install -y zsh

      - name: Run benchmark (minimal profile)
        run: bash tests/benchmark/bench-prompt.sh "$GITHUB_WORKSPACE" --profile=minimal

      - name: Run benchmark (al profile)
        run: bash tests/benchmark/bench-prompt.sh "$GITHUB_WORKSPACE" --profile=al

      - name: Summarize
        run: |
          for profile in minimal al; do
            python3 tests/benchmark/summarize.py \
              "bench-results-Linux-${profile}.json" \
              "tests/benchmark/baselines/bench-results-linux-${profile}.json" \
              >> "$GITHUB_STEP_SUMMARY" || echo "regression=true" >> "$GITHUB_ENV"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux
          path: bench-results-Linux-*.json

  bench-macos:
    name: Benchmark (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install hyperfine starship

      - name: Run benchmark (minimal profile)
        run: bash tests/benchmark/bench-prompt.sh "$GITHUB_WORKSPACE" --profile=minimal

      - name: Run benchmark (al profile)
        run: bash tests/benchmark/bench-prompt.sh "$GITHUB_WORKSPACE" --profile=al

      - name: Summarize
        run: |
          for profile in minimal al; do
            python3 tests/benchmark/summarize.py \
              "bench-results-Darwin-${profile}.json" \
              "tests/benchmark/baselines/bench-results-darwin-${profile}.json" \
              >> "$GITHUB_STEP_SUMMARY" || echo "regression=true" >> "$GITHUB_ENV"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos
          path: bench-results-Darwin-*.json

  bench-windows:
    name: Benchmark (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        shell: pwsh
        run: |
          winget install sharkdp.hyperfine --exact --silent --accept-package-agreements --accept-source-agreements
          winget install Starship.Starship  --exact --silent --accept-package-agreements --accept-source-agreements
          $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH','Machine') + ';' +
                      [System.Environment]::GetEnvironmentVariable('PATH','User')
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: Run benchmark (minimal profile)
        shell: pwsh
        run: pwsh tests/benchmark/bench-prompt.ps1 -GitDir "$env:GITHUB_WORKSPACE" -Profile minimal

      - name: Run benchmark (al profile)
        shell: pwsh
        run: pwsh tests/benchmark/bench-prompt.ps1 -GitDir "$env:GITHUB_WORKSPACE" -Profile al

      - name: Summarize
        shell: pwsh
        run: |
          foreach ($profile in @('minimal', 'al')) {
            $result = python3 tests/benchmark/summarize.py `
              "bench-results-windows-${profile}.json" `
              "tests/benchmark/baselines/bench-results-windows-${profile}.json"
            $result | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            if ($LASTEXITCODE -ne 0) { echo "regression=true" >> $env:GITHUB_ENV }
          }

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows
          path: bench-results-windows-*.json

  open-issue:
    name: Open regression issue
    runs-on: ubuntu-latest
    needs: [bench-linux, bench-macos, bench-windows]
    if: |
      always() &&
      (needs.bench-linux.result == 'failure' ||
       needs.bench-macos.result == 'failure' ||
       needs.bench-windows.result == 'failure')
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: bench-results

      - name: Build issue body
        run: |
          echo "## Prompt performance regression detected" > /tmp/issue-body.md
          echo "" >> /tmp/issue-body.md
          echo "Triggered by: \`${{ github.actor }}\` on \`${{ github.ref_name }}\`" >> /tmp/issue-body.md
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/issue-body.md
          echo "" >> /tmp/issue-body.md
          for f in bench-results/**/*.json; do
            python3 tests/benchmark/summarize.py "$f" >> /tmp/issue-body.md 2>/dev/null || true
            echo "" >> /tmp/issue-body.md
          done

      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ Prompt performance regression ($(date -u +%Y-%m-%d))" \
            --label "performance" \
            --body-file /tmp/issue-body.md
