name: Staleness Check

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Also triggerable manually

jobs:
  # ─── winget package IDs ──────────────────────────────────────────────────────
  check-winget-ids:
    name: Validate winget package IDs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        shell: pwsh
        run: winget install --id MikeFarah.yq --exact --silent --accept-package-agreements --accept-source-agreements
      - name: Refresh PATH
        shell: pwsh
        run: |
          $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' +
                      [System.Environment]::GetEnvironmentVariable('PATH', 'User')
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV
      - name: Validate winget IDs
        shell: pwsh
        run: .github/scripts/validate-winget-ids.ps1

  # ─── brew formula/cask IDs ───────────────────────────────────────────────────
  check-brew-ids:
    name: Validate Homebrew package IDs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: brew install yq
      - name: Validate brew IDs
        run: bash .github/scripts/validate-brew-ids.sh

  # ─── apt package names ───────────────────────────────────────────────────────
  check-apt-ids:
    name: Validate apt package names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          YQ_VERSION=$(curl -fsSL https://api.github.com/repos/mikefarah/yq/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Validate apt IDs
        run: bash .github/scripts/validate-apt-ids.sh

  # ─── Bootstrap URL health ────────────────────────────────────────────────────
  check-bootstrap-urls:
    name: Check bootstrap download URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check URLs referenced in bootstrap scripts
        run: |
          FAILED=0
          URLS=(
            "https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
            "https://downloads.1password.com/linux/keys/1password.asc"
            "https://get.chezmoi.io"
            "https://starship.rs/install.sh"
            "https://api.github.com/repos/mikefarah/yq/releases/latest"
          )
          for url in "${URLS[@]}"; do
            HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" -I "$url")
            if [[ "$HTTP_CODE" -ge 200 ]] && [[ "$HTTP_CODE" -lt 400 ]]; then
              echo "  OK ($HTTP_CODE): $url"
            else
              echo "  FAIL ($HTTP_CODE): $url"
              FAILED=1
            fi
          done
          exit $FAILED

  # ─── Notify on failure ───────────────────────────────────────────────────────
  notify-on-failure:
    name: File issue on failure
    needs: [check-winget-ids, check-brew-ids, check-apt-ids, check-bootstrap-urls]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create GitHub issue
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Staleness check failed — ${new Date().toISOString().split('T')[0]}`,
              body: `One or more staleness checks failed.\n\nWorkflow run: ${runUrl}\n\nPlease review and update package IDs or URLs as needed.`,
              labels: ['staleness', 'maintenance']
            });
