name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/staleness.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/ci-skip.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/staleness.yml'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/ci-skip.yml'
      - '.github/dependabot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint: shellcheck ────────────────────────────────────────────────────────
  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # Exclude .sh.tmpl files — they contain Go template syntax that shellcheck cannot parse
          find . -name "*.sh" | xargs shellcheck --severity=warning

  # ─── Lint: PSScriptAnalyzer ──────────────────────────────────────────────────
  lint-powershell:
    name: Lint PowerShell scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Get-ChildItem -Recurse -Filter "*.ps1" | `
            Where-Object { $_.FullName -notmatch 'node_modules' } | `
            Invoke-ScriptAnalyzer -Severity Warning,Error -Settings PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Output "PSScriptAnalyzer: No issues found."

  # ─── Validate YAML ───────────────────────────────────────────────────────────
  validate-yaml:
    name: Validate package YAML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          YQ_VERSION=$(curl -fsSL https://api.github.com/repos/mikefarah/yq/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Validate packages/*.yaml
        run: bash .github/scripts/validate-apt-ids.sh --dry-run

  # ─── Docker: Linux bootstrap ─────────────────────────────────────────────────
  test-linux-docker:
    name: Docker bootstrap test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build ubuntu-bootstrap Docker image
        run: docker build -f tests/docker/Dockerfile.ubuntu-bootstrap -t dotfiles-ubuntu-bootstrap .
      - name: Run ubuntu-bootstrap Docker test
        run: |
          mkdir -p /tmp/snapshots
          docker run --rm -v /tmp/snapshots:/tmp/snapshot dotfiles-ubuntu-bootstrap
      - name: Upload idempotency snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: idempotency-snapshots
          path: /tmp/snapshots/
      - name: Build and run chezmoi-template Docker test
        run: |
          docker build -f tests/docker/Dockerfile.chezmoi-template -t dotfiles-chezmoi-template .
          docker run --rm dotfiles-chezmoi-template

  # ─── macOS: dry run ──────────────────────────────────────────────────────────
  test-macos-runner:
    name: macOS chezmoi dry-run
    runs-on: macos-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: brew install chezmoi
      - name: Make stub op executable
        run: chmod +x tests/stubs/op
      - name: Run chezmoi dry-run (macOS data)
        run: |
          export PATH="$PWD/tests/stubs:$PATH"
          chezmoi apply \
            --dry-run \
            --verbose \
            --source home/ \
            --config tests/stubs/chezmoi-ci.toml \
            --no-tty \
            --force
      - name: Syntax check bootstrap.sh
        run: bash -n bootstrap/bootstrap.sh

  # ─── Windows: PS syntax + chezmoi dry-run ───────────────────────────────────
  test-windows-runner:
    name: Windows PowerShell + chezmoi dry-run
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        shell: pwsh
        run: winget install --id twpayne.chezmoi --exact --silent --accept-package-agreements --accept-source-agreements
      - name: Refresh PATH
        shell: pwsh
        run: |
          $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' +
                      [System.Environment]::GetEnvironmentVariable('PATH', 'User')
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV
      - name: Parse PS1 syntax (bootstrap)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "bootstrap/bootstrap.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: chezmoi dry-run (Windows data)
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path tests/stubs);$env:PATH"
          chezmoi apply `
            --dry-run `
            --verbose `
            --source home/ `
            --config tests/stubs/chezmoi-ci.toml `
            --no-tty `
            --force

  # ─── Report gate ─────────────────────────────────────────────────────────────
  report:
    name: CI gate
    needs: [lint-shell, lint-powershell, validate-yaml, test-linux-docker, test-macos-runner, test-windows-runner]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
