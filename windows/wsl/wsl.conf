# /etc/wsl.conf — WSL2 configuration
# Managed by chezmoi; deployed to /etc/wsl.conf inside WSL

[boot]
systemd=true

[automount]
enabled=true
root=/mnt/
options="metadata,umask=22,fmask=11"
mountFsTab=false

[network]
generateHosts=true
generateResolvConf=true

[interop]
enabled=true
appendWindowsPath=true

[user]
default=al
